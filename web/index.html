<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Stop phones zooming on double-tap or pinch: every touch belongs to the game. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#161a1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SubHunt</title>
  <style>
    html, body { margin: 0; height: 100%; background: #161a1e; color: #f2b634; font-family: ui-monospace, monospace; }
    /* No scrolling, pull-to-refresh, text selection or tap highlights. */
    html, body, #game, #subhunt {
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Bevy's `fit_canvas_to_parent` sizes the canvas to fill this box. */
    #game { position: fixed; inset: 0; }
    #subhunt { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
    #loading.hidden { display: none; }
    /* Problems are shown on the page, because phones have no developer console. */
    #problems { position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 45%; overflow: auto; z-index: 10;
      margin: 0; padding: 8px; background: #2a0d0b; color: #ffb4a8; border: 1px solid #d63226;
      font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
  </style>
</head>
<body>
  <div id="game"><canvas id="subhunt" tabindex="0"></canvas></div>
  <pre id="problems" hidden></pre>
  <div id="loading"><p>Loading SubHunt…<br><small>Drag the levers and press the buttons with your mouse or finger.<br>On a computer, the keyboard works too.</small></p></div>
  <script>
    // Show errors on the page so they can be read (and screenshotted) on a phone.
    function reportProblem(text) {
      const box = document.getElementById("problems");
      if (!box || box.textContent.length > 4000) return;
      box.hidden = false;
      box.textContent += text.replace(/%c/g, "").slice(0, 600) + "\n";
    }
    const originalError = console.error;
    console.error = (...args) => {
      originalError(...args);
      // Bevy colours its log lines with CSS; leave those arguments out.
      reportProblem(args.filter(a => !String(a).startsWith("color:")).map(String).join(" "));
    };
    window.addEventListener("error", e => reportProblem("Error: " + e.message));
    window.addEventListener("unhandledrejection", e => {
      const text = String(e.reason);
      if (!text.includes("Using exceptions for control flow")) reportProblem("Error: " + text);
    });
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("subhunt").addEventListener("webglcontextlost", () =>
        reportProblem("The browser stopped the game's graphics (WebGL context lost)."));
    });

    // Where to find a multiplayer game server. Leave empty to use the server
    // that served this page, or practice mode if there isn't one (as on GitHub
    // Pages). Once you host a server, put its address here, for example:
    //   window.SUBHUNT_SERVER = "wss://subhunt.onrender.com/ws";
    // A `?server=...` parameter in the page address overrides this, and
    // `?practice` always starts a practice game.
    window.SUBHUNT_SERVER = "";
  </script>
  <script type="module">
    // `pkg/` is generated by scripts/build-web.sh (wasm-bindgen output).
    import init from "./pkg/subhunt.js";
    const loading = document.getElementById("loading");
    const canvas = document.getElementById("subhunt");
    try {
      // Bevy throws a harmless "control flow" exception to take over the
      // browser's event loop, so the game keeps running after this rejects.
      await init();
    } catch (error) {
      if (!String(error).includes("Using exceptions for control flow")) {
        loading.innerHTML = "<p>Couldn't start SubHunt.<br><small>" + error + "</small></p>";
        throw error;
      }
    }
  </script>
  <script>
    // Hide the loading message once Bevy has drawn into the canvas, and give it
    // keyboard focus so the controls work straight away.
    const poll = setInterval(() => {
      const canvas = document.getElementById("subhunt");
      if (canvas.width > 300) {
        document.getElementById("loading").classList.add("hidden");
        canvas.focus();
        clearInterval(poll);
      }
    }, 200);
  </script>
</body>
</html>
