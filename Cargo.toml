# This is a Cargo *workspace*: several crates (Rust packages) that are built
# together and share one `target/` folder and one `Cargo.lock`.
#
# Each crate is one layer of the hexagonal architecture. Cargo enforces the
# dependency rule for us: a crate can only use crates it lists as dependencies,
# so `domain` physically cannot reach Bevy or the network.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
# Our own crates (inner layers first).
subhunt-domain = { path = "crates/domain" }
subhunt-application = { path = "crates/application" }
subhunt-protocol = { path = "crates/protocol" }
subhunt-net-tcp = { path = "crates/net-tcp" }
subhunt-net-ws = { path = "crates/net-ws" }
subhunt-net-browser = { path = "crates/net-browser" }

# Third-party crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
# Browser bindings, used only by the WebAssembly build of the client.
wasm-bindgen = "0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "Window", "Location", "Url", "UrlSearchParams"] }
# "2d" gives us a window, input and textures. "ui" is how the instrument panel
# is put on screen (as a UI image; see panel_plugin.rs for why not a sprite).
# "bevy_audio" + "wav" play the sound effects, which we synthesise as WAV data
# in memory (see the client's sound module). We skip "3d" and the compressed
# audio formats to keep compile times and the web download down.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "bevy_audio", "wav"] }

# Bevy is slow when built without optimisations. These settings optimise all
# dependencies fully while keeping our own code quick to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Skip debug info for dependencies: it takes gigabytes of disk for Bevy and
# you'll rarely step through Bevy's own code. Our crates keep full debug info.
debug = false

# Used by scripts/build-web.sh. Browsers have to download the whole game, so
# optimise for size, remove debug info and let the linker drop unused code.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
