[package]
name = "subhunt-client"
description = "Bevy client: keyboard in, sonar scope out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
subhunt-domain.workspace = true
subhunt-application.workspace = true
bevy.workspace = true

# Rust note: target-specific dependencies. The desktop build talks TCP; the
# WebAssembly build (which runs in a browser) talks WebSockets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
subhunt-net-tcp.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
subhunt-net-browser.workspace = true
